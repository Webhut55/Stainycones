<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Bag - StainyCones</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --color-black: #111111;
            --color-white: #FFFFFF;
            --color-light-grey: #F5F5F5;
            --color-dark-grey: #333333;
            --color-whatsapp: #25D366;
            --color-error: #cc3333;
            --color-border: #ebebeb;
            --color-accent: #f9f9f9;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #fafafa;
            color: var(--color-black);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }
        .container { max-width: 720px; margin: 0 auto; padding: 20px 20px 60px; }

        /* HEADER */
        .header {
            background: rgba(255,255,255,0.96);
            padding: 16px 0 16px;
            border-bottom: 1px solid var(--color-border);
            margin-bottom: 30px;
            position: sticky; top: 0; z-index: 100;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
        .header-inner { max-width: 720px; margin: 0 auto; padding: 0 20px; display: flex; align-items: center; justify-content: space-between; }
        .back-link {
            text-decoration: none; color: var(--color-black);
            font-weight: 600; font-size: 0.9rem;
            display: flex; align-items: center; gap: 5px;
            transition: color 0.3s;
        }
        .back-link:hover { color: var(--color-dark-grey); }
        .header-title { font-size: 1rem; font-weight: 800; letter-spacing: 1px; }

        /* MIN ORDER BANNER */
        .min-order-banner {
            background: #fff4f4;
            color: var(--color-error);
            padding: 12px 16px;
            border-radius: 10px;
            text-align: center;
            font-weight: 600;
            font-size: 0.85rem;
            margin-bottom: 25px;
            border: 1px solid #ffebeb;
        }

        .cart-title { font-size: 2rem; font-weight: 800; margin-bottom: 25px; letter-spacing: -0.5px; }

        /* CART ITEMS */
        .cart-item {
            display: flex; align-items: center;
            padding: 16px;
            border: 1px solid var(--color-border);
            border-radius: 16px;
            margin-bottom: 14px;
            background: var(--color-white);
            gap: 16px;
            transition: box-shadow 0.3s ease;
        }
        .cart-item:hover { box-shadow: 0 6px 20px rgba(0,0,0,0.06); }
        .item-image {
            width: 85px; height: 85px;
            object-fit: cover; border-radius: 12px;
            flex-shrink: 0; background: var(--color-light-grey);
        }
        .item-info { flex-grow: 1; }
        .item-name { font-weight: 700; text-transform: uppercase; font-size: 0.88rem; margin-bottom: 3px; }
        .item-variant { font-size: 0.78rem; color: #888; margin-bottom: 10px; }

        /* QUANTITY CONTROLS */
        .quantity-controls {
            display: flex; align-items: center;
            border: 1px solid var(--color-border);
            border-radius: 8px; width: fit-content;
            overflow: hidden; margin-bottom: 10px;
        }
        .qty-btn {
            border: none; background: var(--color-accent);
            padding: 5px 13px; cursor: pointer;
            font-weight: 700; font-size: 1rem;
            color: var(--color-dark-grey);
            transition: background 0.2s;
        }
        .qty-btn:hover { background: #eee; }
        .qty-display {
            font-weight: 700; color: var(--color-black);
            min-width: 30px; text-align: center;
            font-size: 0.95rem;
        }

        /* REMOVE BUTTON */
        .remove-box {
            background: transparent;
            color: var(--color-error);
            padding: 3px 0;
            border: none;
            font-size: 0.78rem;
            font-weight: 700;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: opacity 0.2s;
            display: block;
        }
        .remove-box:hover { opacity: 0.7; }

        .item-price { font-weight: 800; font-size: 1rem; flex-shrink: 0; }

        /* SUMMARY */
        .cart-summary {
            margin-top: 30px; padding: 25px;
            background: var(--color-white);
            border-radius: 16px;
            border: 1px solid var(--color-border);
        }
        .summary-title { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1.5px; font-weight: 700; color: #999; margin-bottom: 20px; }
        .summary-row {
            display: flex; justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid var(--color-border);
            font-weight: 600; font-size: 0.95rem;
        }
        .summary-row:last-of-type { border-bottom: none; font-size: 1.1rem; }
        .total-amount { color: var(--color-black); font-size: 1.3rem; font-weight: 800; }

        /* ORDER BUTTON */
        .order-btn {
            width: 100%; padding: 18px;
            background-color: var(--color-whatsapp);
            color: var(--color-white); border: none; border-radius: 12px;
            font-weight: 800; font-size: 1rem; cursor: pointer;
            margin-top: 20px; text-transform: uppercase; letter-spacing: 1px;
            box-shadow: 0 6px 20px rgba(37, 211, 102, 0.35);
            transition: all 0.3s ease;
        }
        .order-btn:hover { transform: translateY(-3px); box-shadow: 0 10px 28px rgba(37, 211, 102, 0.45); }
        .order-btn:active { transform: translateY(0); }
        .order-btn:disabled { background-color: #ccc; cursor: not-allowed; box-shadow: none; transform: none; }

        .error-text { color: var(--color-error); font-size: 0.82rem; margin-top: 12px; text-align: center; display: none; font-weight: 600; }

        /* EMPTY STATE */
        .empty-cart-state {
            display: none; text-align: center;
            padding: 80px 20px; color: #aaa;
        }
        .empty-icon { font-size: 4rem; margin-bottom: 15px; }
        .empty-cart-state p { font-size: 1rem; font-weight: 600; margin-bottom: 20px; color: #888; }
        .empty-cart-state a {
            display: inline-block;
            padding: 14px 30px;
            background: var(--color-black);
            color: var(--color-white);
            text-decoration: none;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.9rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: opacity 0.3s;
        }
        .empty-cart-state a:hover { opacity: 0.85; }
    </style>
</head>
<body onload="renderCart()">

    <header class="header">
        <div class="header-inner">
            <a href="index.html" class="back-link">← Continue Shopping</a>
            <span class="header-title">STAINYCONES</span>
        </div>
    </header>

    <div class="container">
        <div class="min-order-banner">🛍️ Minimum order value is ₹150/-</div>

        <h1 class="cart-title">Your Bag</h1>

        <div id="cart-items-container"></div>

        <div id="cart-summary-container">
            <div class="cart-summary">
                <p class="summary-title">Order Summary</p>
                <div class="summary-row">
                    <span>Subtotal</span>
                    <span id="subtotal">₹0</span>
                </div>
                <div class="summary-row">
                    <span>Total</span>
                    <span id="grand-total" class="total-amount">₹0</span>
                </div>
            </div>

            <button id="place-order-btn" class="order-btn" onclick="placeOrder()">
                📲 Place Order via WhatsApp
            </button>
            <p id="min-error-msg" class="error-text">Minimum order amount is ₹150. Please add more items.</p>
        </div>

        <div id="empty-cart" class="empty-cart-state">
            <div class="empty-icon">🛒</div>
            <p>Your bag is empty!</p>
            <a href="index.html">Shop Now</a>
        </div>
    </div>

    <script>
        function renderCart() {
            const cart = JSON.parse(localStorage.getItem('mehndiStoreCart')) || [];
            const container = document.getElementById('cart-items-container');
            const summary = document.getElementById('cart-summary-container');
            const emptyMsg = document.getElementById('empty-cart');
            const orderBtn = document.getElementById('place-order-btn');
            const errorMsg = document.getElementById('min-error-msg');

            if (cart.length === 0) {
                container.innerHTML = '';
                summary.style.display = 'none';
                emptyMsg.style.display = 'block';
                return;
            }

            emptyMsg.style.display = 'none';
            summary.style.display = 'block';
            container.innerHTML = '';
            let total = 0;

            cart.forEach((item, index) => {
                const itemTotal = item.price * item.quantity;
                total += itemTotal;
                const div = document.createElement('div');
                div.className = 'cart-item';
                div.innerHTML = `
                    <img src="${item.image}" class="item-image" alt="${item.name}" loading="lazy">
                    <div class="item-info">
                        <div class="item-name">${item.name}</div>
                        <div class="item-variant">${item.variant}</div>
                        <div class="quantity-controls">
                            <button class="qty-btn" onclick="updateQty(${index}, -1)">−</button>
                            <span class="qty-display">${item.quantity}</span>
                            <button class="qty-btn" onclick="updateQty(${index}, 1)">+</button>
                        </div>
                        <button class="remove-box" onclick="removeItem(${index})">✕ Remove</button>
                    </div>
                    <div class="item-price">₹${itemTotal}</div>
                `;
                container.appendChild(div);
            });

            document.getElementById('subtotal').innerText = `₹${total}`;
            document.getElementById('grand-total').innerText = `₹${total}`;

            if (total < 150) {
                orderBtn.disabled = true;
                errorMsg.style.display = 'block';
            } else {
                orderBtn.disabled = false;
                errorMsg.style.display = 'none';
            }
        }

        function updateQty(index, change) {
            let cart = JSON.parse(localStorage.getItem('mehndiStoreCart'));
            cart[index].quantity += change;
            if (cart[index].quantity < 1) cart[index].quantity = 1;
            localStorage.setItem('mehndiStoreCart', JSON.stringify(cart));
            renderCart();
        }

        function removeItem(index) {
            let cart = JSON.parse(localStorage.getItem('mehndiStoreCart'));
            cart.splice(index, 1);
            localStorage.setItem('mehndiStoreCart', JSON.stringify(cart));
            renderCart();
        }

        function placeOrder() {
            const cart = JSON.parse(localStorage.getItem('mehndiStoreCart'));
            let message = 'New Order from StainyCones Website:\n\n';
            cart.forEach(item => {
                message += `• ${item.name} (${item.variant}) x${item.quantity} = ₹${item.price * item.quantity}\n`;
            });
            message += `\nTotal: ${document.getElementById('grand-total').innerText}`;
            window.open(`https://wa.me/919744468830?text=${encodeURIComponent(message)}`, '_blank');
        }
    </script>
</body>
</html>
